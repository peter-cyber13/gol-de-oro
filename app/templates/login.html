{% extends "base.html" %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <img src="/static/logo-gol-de-oro.jpg" alt="Gol de Oro"
                 class="w-44 h-44 object-cover rounded-2xl mx-auto shadow-xl border-4 border-white/80"
                 style="box-shadow: 0 8px 32px rgba(212, 168, 67, 0.25);">
            <h1 class="text-3xl font-bold mt-4" style="color: #7a9a5a;">🍺 Gol de Oro</h1>
            <p class="text-gray-500 mt-1 text-sm">Inicia sesión para continuar</p>
        </div>

        <form method="POST" class="bg-white/95 backdrop-blur-sm p-8 rounded-2xl shadow-xl border border-dorado/20 space-y-5"
              style="box-shadow: 0 8px 40px rgba(0,0,0,0.08);">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Correo electrónico</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#d4a843] focus:border-transparent transition-all bg-gray-50/50"
                       placeholder="correo@ejemplo.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Contraseña</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#d4a843] focus:border-transparent transition-all bg-gray-50/50"
                       placeholder="••••••••">
            </div>
            <button type="submit"
                    class="w-full py-3.5 rounded-xl font-bold text-white text-base transition-all"
                    style="background: linear-gradient(135deg, #d4a843, #c99a33); box-shadow: 0 4px 16px rgba(212,168,67,0.3);"
                    onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 6px 24px rgba(212,168,67,0.4)'"
                    onmouseout="this.style.transform='';this.style.boxShadow='0 4px 16px rgba(212,168,67,0.3)'">
                Iniciar sesión
            </button>
        </form>

        <p class="text-center mt-6">
            <a href="/recuperar" class="text-sm text-[#d4a843] hover:text-[#b8922e] hover:underline transition-colors">¿Olvidaste tu contraseña?</a>
        </p>
    </div>
</div>
{% endblock %}
