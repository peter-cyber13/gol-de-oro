{% extends "base.html" %}
{% block extra_head %}
<script>
let carrito = [];

function agregarProducto(id, nombre) {
    const existente = carrito.find(p => p.id === id);
    if (existente) {
        existente.cantidad++;
    } else {
        carrito.push({ id, nombre, cantidad: 1 });
    }
    renderCarrito();
}

function cambiarCantidad(id, delta) {
    const p = carrito.find(p => p.id === id);
    if (!p) return;
    p.cantidad = Math.max(1, p.cantidad + delta);
    renderCarrito();
}

function eliminarProducto(id) {
    carrito = carrito.filter(p => p.id !== id);
    renderCarrito();
}

function renderCarrito() {
    const cont = document.getElementById('carrito-contenido');
    const total = document.getElementById('total-productos');
    if (carrito.length === 0) {
        cont.innerHTML = '<p class="text-gray-400 text-center py-4">Sin productos agregados</p>';
        total.textContent = '0';
        return;
    }
    let html = '';
    carrito.forEach(p => {
        html += `<div class="flex items-center justify-between py-2 border-b border-gray-100">
            <span class="font-medium">${p.nombre}</span>
            <div class="flex items-center gap-2">
                <button onclick="cambiarCantidad(${p.id}, -1)" class="w-7 h-7 rounded-full bg-gray-200 hover:bg-gray-300">−</button>
                <span class="font-bold w-8 text-center">${p.cantidad}</span>
                <button onclick="cambiarCantidad(${p.id}, 1)" class="w-7 h-7 rounded-full bg-gray-200 hover:bg-gray-300">+</button>
                <button onclick="eliminarProducto(${p.id})" class="text-red-400 hover:text-red-600 ml-2">✕</button>
            </div>
        </div>`;
    });
    cont.innerHTML = html;
    total.textContent = carrito.length;
}

function guardarPedido() {
    if (carrito.length === 0) {
        alert('Agrega al menos un producto al carrito.');
        return;
    }
    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;
    btn.textContent = '⏳ Guardando...';

    fetch('/pedidos/nuevo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            productos: carrito.map(p => ({ id: p.id, cantidad: p.cantidad })),
            cliente: document.getElementById('cliente').value
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            mostrarToast(`✅ Venta ${data.folio} registrada`);
            carrito = [];
            renderCarrito();
            document.getElementById('cliente').value = '';
        } else {
            mostrarToast(`❌ ${data.error || 'Error al guardar'}`, 'error');
        }
    })
    .catch(e => {
        mostrarToast('❌ Error de conexión', 'error');
    })
    .finally(() => {
        btn.disabled = false;
        btn.textContent = '💾 Guardar Venta';
    });
}

function mostrarToast(mensaje, tipo = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = mensaje;
    toast.className = 'fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg text-white transition-all ' +
        (tipo === 'success' ? 'bg-green-600' : 'bg-red-600');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

function filtrarCategoria(cat) {
    const buttons = document.querySelectorAll('[data-categoria]');
    buttons.forEach(b => {
        b.style.display = (cat === 'todas' || b.dataset.categoria === cat) ? '' : 'none';
    });
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('bg-[#d4a843]', 'text-white'));
    event.target.classList.add('bg-[#d4a843]', 'text-white');
}

function buscarProducto() {
    const q = document.getElementById('buscador').value.toLowerCase();
    const buttons = document.querySelectorAll('[data-nombre]');
    buttons.forEach(b => {
        b.style.display = b.dataset.nombre.includes(q) ? '' : 'none';
    });
}
</script>
{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Toast -->
    <div id="toast" style="display:none; position:fixed; top:1rem; right:1rem; z-index:50;"></div>

    <h1 class="text-2xl font-bold mb-4">🛒 Venta de producto</h1>

    <div class="grid md:grid-cols-5 gap-4">
        <!-- Productos (cols 1-3) -->
        <div class="md:col-span-3 bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <!-- Buscador -->
            <input type="text" id="buscador" oninput="buscarProducto()"
                   placeholder="🔍 Buscar producto…"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-[#d4a843]">

            <!-- Categorías -->
            <div class="flex gap-2 mb-4 flex-wrap">
                <button onclick="filtrarCategoria('todas')" class="cat-btn bg-[#d4a843] text-white px-3 py-1 rounded-full text-sm">Todas</button>
                {% for cat in categorias %}
                <button onclick="filtrarCategoria('{{ cat }}')" class="cat-btn bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded-full text-sm">{{ cat }}</button>
                {% endfor %}
            </div>

            <!-- Productos grid -->
            <div class="grid grid-cols-2 gap-2 max-h-96 overflow-y-auto">
                {% for p in productos %}
                <button type="button"
                        onclick="agregarProducto({{ p.id }}, '{{ p.nombre }}')"
                        data-categoria="{{ p.categoria }}"
                        data-nombre="{{ p.nombre|lower }}"
                        class="text-left px-3 py-2 rounded-lg border border-gray-200 hover:border-[#d4a843] hover:bg-yellow-50 transition">
                    <span class="block">{{ icono_categoria(p.categoria) }} {{ p.nombre }}</span>
                    <span class="text-xs text-gray-400">{{ p.unidad_medida }}</span>
                </button>
                {% endfor %}
            </div>
        </div>

        <!-- Carrito (cols 4-5) -->
        <div class="md:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h2 class="font-semibold mb-3 flex justify-between">
                <span>🛒 Carrito</span>
                <span id="total-productos" class="text-[#d4a843] font-bold">0</span>
            </h2>

            <div id="carrito-contenido" class="space-y-1 min-h-[150px]">
                <p class="text-gray-400 text-center py-4">Sin productos agregados</p>
            </div>

            <div class="mt-4">
                <label class="block text-sm text-gray-600 mb-1">Cliente (opcional)</label>
                <input type="text" id="cliente" placeholder="Nombre o Mostrador"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
            </div>

            <button id="btn-guardar" onclick="guardarPedido()"
                    class="w-full btn-dorado font-semibold mt-4 py-3">
                💾 Guardar Venta
            </button>
        </div>
    </div>
</div>
{% endblock %}
