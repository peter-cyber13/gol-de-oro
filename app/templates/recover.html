{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h1 class="text-2xl font-bold text-center mb-2">Recuperar contraseña</h1>
    <p class="text-gray-500 text-center mb-6">Ingresa tu correo y te enviaremos instrucciones</p>

    <form method="POST" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
            <input type="email" name="email" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]"
                   placeholder="correo@ejemplo.com">
        </div>
        <button type="submit" class="w-full btn-dorado font-semibold py-3">Enviar instrucciones</button>
    </form>

    <p class="text-center mt-4">
        <a href="/login" class="text-sm text-[#d4a843] hover:underline">Volver al inicio de sesión</a>
    </p>
</div>
{% endblock %}
