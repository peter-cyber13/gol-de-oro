{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto">
    <a href="/admin/productos" class="text-sm text-[#d4a843] hover:underline mb-4 inline-block">← Productos</a>
    <h1 class="text-2xl font-bold mb-6">{% if producto %}Editar{% else %}Nuevo{% endif %} Producto</h1>

    <form method="POST" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <input type="text" name="nombre" value="{{ producto.nombre if producto else '' }}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                <select name="categoria" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
                    <option value="cerveza" {% if producto and producto.categoria == 'cerveza' %}selected{% endif %}>🍺 Cerveza</option>
                    <option value="licor" {% if producto and producto.categoria == 'licor' %}selected{% endif %}>🥃 Licor</option>
                    <option value="refresco" {% if producto and producto.categoria == 'refresco' %}selected{% endif %}>🥤 Refresco</option>
                    <option value="snack" {% if producto and producto.categoria == 'snack' %}selected{% endif %}>🍿 Snack</option>
                    <option value="otro" {% if producto and producto.categoria == 'otro' %}selected{% endif %}>📦 Otro</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Unidad de medida</label>
                <select name="unidad_medida" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
                    <option value="unidad" {% if producto and producto.unidad_medida == 'unidad' %}selected{% endif %}>Unidad</option>
                    <option value="botella" {% if producto and producto.unidad_medida == 'botella' %}selected{% endif %}>Botella</option>
                    <option value="lata" {% if producto and producto.unidad_medida == 'lata' %}selected{% endif %}>Lata</option>
                    <option value="litro" {% if producto and producto.unidad_medida == 'litro' %}selected{% endif %}>Litro</option>
                    <option value="kg" {% if producto and producto.unidad_medida == 'kg' %}selected{% endif %}>Kg</option>
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Frecuencia de inventario</label>
            <select name="frecuencia_inventario" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
                <option value="diario" {% if producto and producto.frecuencia_inventario == 'diario' %}selected{% endif %}>Diario</option>
                <option value="diario_semanal" {% if producto and producto.frecuencia_inventario == 'diario_semanal' %}selected{% endif %}>Diario + Semanal</option>
            </select>
        </div>
        {% if producto %}
        <div>
            <label class="flex items-center gap-2">
                <input type="checkbox" name="activo" value="1" {% if producto.activo %}checked{% endif %}
                       class="rounded border-gray-300 text-[#d4a843] focus:ring-[#d4a843]">
                <span class="text-sm text-gray-700">Producto activo</span>
            </label>
        </div>
        {% endif %}
        <button type="submit" class="btn-dorado w-full font-semibold py-3">
            {% if producto %}Actualizar{% else %}Crear{% endif %} producto
        </button>
    </form>
</div>
{% endblock %}
