{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto">
    <a href="/admin/usuarios" class="text-sm text-[#d4a843] hover:underline mb-4 inline-block">← Usuarios</a>
    <h1 class="text-2xl font-bold mb-6">{% if usuario %}Editar{% else %}Nuevo{% endif %} Usuario</h1>

    <form method="POST" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <input type="text" name="nombre" value="{{ usuario.nombre if usuario else '' }}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" value="{{ usuario.email if usuario else '' }}"
                   {% if not usuario %}required{% endif %}
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
            {% if usuario %}<p class="text-xs text-gray-400 mt-1">Dejar en blanco para mantener el actual (edición de email no soportada)</p>{% endif %}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" name="password" minlength="6"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]"
                   placeholder="{% if usuario %}Nueva contraseña (opcional){% else %}Mínimo 6 caracteres{% endif %}">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
            <select name="rol" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
                <option value="empleado" {% if usuario and usuario.rol == 'empleado' %}selected{% endif %}>Empleado</option>
                <option value="encargado" {% if usuario and usuario.rol == 'encargado' %}selected{% endif %}>Encargado</option>
                <option value="admin" {% if usuario and usuario.rol == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        {% if usuario %}
        <div>
            <label class="flex items-center gap-2">
                <input type="checkbox" name="activo" value="1" {% if usuario.activo %}checked{% endif %}
                       class="rounded border-gray-300 text-[#d4a843] focus:ring-[#d4a843]">
                <span class="text-sm text-gray-700">Usuario activo</span>
            </label>
        </div>
        {% endif %}
        <button type="submit" class="btn-dorado w-full font-semibold py-3">
            {% if usuario %}Actualizar{% else %}Crear{% endif %} usuario
        </button>
    </form>
</div>
{% endblock %}
