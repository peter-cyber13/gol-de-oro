{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h1 class="text-2xl font-bold text-center mb-2">Nueva contraseña</h1>
    <p class="text-gray-500 text-center mb-6">Elige una contraseña nueva</p>

    <form method="POST" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
            <input type="password" name="password" required minlength="6"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]"
                   placeholder="Mínimo 6 caracteres">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
            <input type="password" name="confirm" required minlength="6"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]"
                   placeholder="Repite la contraseña">
        </div>
        <button type="submit" class="w-full btn-dorado font-semibold py-3">Cambiar contraseña</button>
    </form>
</div>
{% endblock %}
