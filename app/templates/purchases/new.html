{% extends "base.html" %}
{% block content %}
<div class="space-y-4">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">🛒 Nueva Compra</h1>
        <a href="/compras" class="text-sm text-[#d4a843] hover:underline">Ver compras</a>
    </div>

    <form method="POST" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Proveedor</label>
                <input type="text" name="proveedor"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]"
                       placeholder="Distribuidora…">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Folio compra</label>
                <input type="text" name="folio_compra"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]"
                       placeholder="Opcional">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                <input type="date" name="fecha" value="{{ today }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
            </div>
        </div>

        <h2 class="font-semibold pt-2">Productos recibidos</h2>

        <div id="lineas-compra">
            <div class="grid grid-cols-2 gap-4 mb-2 linea-producto">
                <div>
                    <select name="producto_id[]" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
                        <option value="">Seleccionar producto…</option>
                        {% for p in productos %}
                        <option value="{{ p.id }}">{{ icono_categoria(p.categoria) }} {{ p.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex gap-2">
                    <input type="number" name="cantidad[]" step="0.01" min="0.01" required
                           placeholder="Cantidad"
                           class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4a843]">
                    <button type="button" onclick="this.closest('.linea-producto').remove()"
                            class="text-red-400 hover:text-red-600 px-2">✕</button>
                </div>
            </div>
        </div>

        <button type="button" onclick="agregarLinea()"
                class="text-sm text-[#d4a843] hover:underline">+ Agregar otro producto</button>

        <div class="pt-4">
            <button type="submit" class="btn-dorado font-semibold">💾 Registrar compra</button>
        </div>
    </form>
</div>

<script>
function agregarLinea() {
    const container = document.getElementById('lineas-compra');
    const template = container.querySelector('.linea-producto');
    const nueva = template.cloneNode(true);
    nueva.querySelectorAll('input').forEach(i => i.value = '');
    nueva.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
    container.appendChild(nueva);
}
</script>
{% endblock %}
