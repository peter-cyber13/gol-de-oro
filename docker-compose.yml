version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goldeoro
      POSTGRES_USER: goldeoro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGEME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldeoro"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      DATABASE_URL: postgresql://goldeoro:${DB_PASSWORD:-CHANGEME}@db:5432/goldeoro
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: "true"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./backups:/app/backups

volumes:
  postgres_data: